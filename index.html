<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나의 할 일</title>
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="광고 없는 나만의 할 일 관리">
  <!-- 앱처럼 설치하기 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="할 일">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="loading" data-tab="home">
  <div class="loading-screen" aria-live="polite">
    <span class="loading-dot"></span>
    불러오는 중…
  </div>

  <div class="login-screen">
    <div class="login-card">
      <svg class="login-clover" viewBox="0 0 40 40" aria-hidden="true">
        <g opacity="0.85">
          <circle cx="13" cy="13" r="10.5" fill="#5B8DEF"/>
          <circle cx="27" cy="13" r="10.5" fill="#8E7CE0"/>
          <circle cx="27" cy="27" r="10.5" fill="#4DB6A0"/>
          <circle cx="13" cy="27" r="10.5" fill="#F0A96B"/>
        </g>
      </svg>
      <h1 class="login-title">나의 할 일</h1>
      <p class="login-text">컴퓨터와 휴대폰에서 같은 목록을 보려면<br>구글 계정으로 로그인해 주세요.</p>
      <button id="login-button" class="login-button" type="button">Google 계정으로 로그인</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </div>

  <!-- ===== 홈: 달력 + 할 일 ===== -->
  <main class="app" id="view-home">
    <section class="calendar" aria-label="달력">
      <div class="cal-header">
        <button id="cal-prev" class="cal-nav" type="button" aria-label="이전 달">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
        </button>
        <h2 id="cal-title" class="cal-title"></h2>
        <button id="cal-next" class="cal-nav" type="button" aria-label="다음 달">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
        </button>
        <button id="cal-today" class="cal-today" type="button">오늘</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
    </section>

    <section class="day">
      <header class="day-header">
        <div class="day-top">
          <p id="day-label" class="day-label"></p>
          <div class="day-actions">
            <button id="start-select" class="menu-button" type="button" aria-label="여러 개 선택">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M7 10.2l2.1 2.1L13.2 8"/></svg>
            </button>
            <button id="open-menu" class="menu-button" type="button" aria-label="메뉴" aria-haspopup="menu" aria-expanded="false" aria-controls="home-menu">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12"/></svg>
            </button>
            <div id="home-menu" class="menu-popover" role="menu" hidden>
              <button id="open-archive" class="menu-item" type="button" role="menuitem">보관함</button>
              <button id="open-cats" class="menu-item" type="button" role="menuitem">카테고리 관리</button>
              <button id="open-routines" class="menu-item" type="button" role="menuitem">루틴 관리</button>
            </div>
          </div>
        </div>
        <h1 id="day-title" class="day-title"></h1>
        <div class="progress">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
      </header>

      <div id="sections" class="sections"></div>
      <button id="postpone-undone" class="postpone-link" type="button" hidden></button>
      <p id="empty-message" class="empty-message">카테고리 이름을 눌러 할 일을 추가해 보세요.</p>
    </section>
  </main>

  <!-- ===== 플래너: 시간대별 블록 목록 ===== -->
  <section class="view" id="view-planner" aria-label="플래너">
    <div class="view-inner">
      <div class="planner-head">
        <button id="pl-prev" class="cal-nav" type="button" aria-label="전날">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
        </button>
        <button id="pl-date" class="planner-date" type="button" aria-expanded="false"></button>
        <button id="pl-next" class="cal-nav" type="button" aria-label="다음날">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
        </button>
        <button id="pl-templates" class="text-button planner-tpl" type="button">틀</button>
      </div>
      <div id="pl-cal" class="planner-cal" hidden></div>
      <div id="pl-list" class="planner-list"></div>
      <p id="pl-empty" class="empty-message">아직 계획이 없어요.<br>아래 <b>+ 일정 추가</b>로 시간대를 만들어 보세요.</p>
      <button id="pl-add" class="cat-add planner-add" type="button">+ 일정 추가</button>
    </div>
  </section>

  <!-- ===== 개인정보 ===== -->
  <section class="view" id="view-me" aria-labelledby="me-title">
    <div class="view-inner">
      <h1 id="me-title" class="view-title">개인정보</h1>

      <div class="profile-card">
        <div class="profile-photo" id="profile-photo" aria-hidden="true"></div>
        <div class="profile-text">
          <p id="profile-name" class="profile-name"></p>
          <p id="profile-email" class="profile-email"></p>
        </div>
      </div>

      <ul class="settings-list">
        <li><button class="settings-item" type="button" data-soon="알림 설정">알림 설정<span class="soon-badge">준비 중</span></button></li>
        <li><button class="settings-item" type="button" data-soon="프로필 설정">프로필 설정<span class="soon-badge">준비 중</span></button></li>
        <li><button class="settings-item" type="button" data-soon="테마 설정">테마 설정<span class="soon-badge">준비 중</span></button></li>
      </ul>

      <ul class="settings-list">
        <li id="install-row" hidden><button id="install-app" class="settings-item" type="button">이 기기에 앱 설치</button></li>
        <li><button id="logout" class="settings-item danger" type="button">로그아웃</button></li>
      </ul>
    </div>
  </section>

  <!-- ===== 여러 개 선택했을 때 아래에 나오는 막대 ===== -->
  <div id="select-bar" class="select-bar" hidden>
    <div class="select-top">
      <span id="select-count" class="select-count"></span>
      <button id="select-all" class="chip-button" type="button">전체 선택</button>
      <button id="select-undone" class="chip-button" type="button">미완료만</button>
      <button id="select-cancel" class="select-cancel" type="button">취소</button>
    </div>
    <div class="select-actions">
      <button class="select-action" type="button" data-bulk="move">이동</button>
      <button class="select-action" type="button" data-bulk="copy">복사</button>
      <button class="select-action" type="button" data-bulk="archive">보관</button>
      <button class="select-action danger" type="button" data-bulk="delete">삭제</button>
    </div>
  </div>

  <!-- ===== 하단 메뉴바 ===== -->
  <nav class="tabbar" aria-label="메뉴">
    <button class="tab" type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
      <span>홈</span>
    </button>
    <button class="tab" type="button" data-tab="planner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>플래너</span>
    </button>
    <button class="tab" type="button" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.6 3.9-5.8 7.5-5.8s6.7 2.2 7.5 5.8"/></svg>
      <span>개인정보</span>
    </button>
  </nav>

  <dialog id="cat-dialog" class="sheet" aria-labelledby="cat-dialog-title">
    <div class="sheet-head">
      <h2 id="cat-dialog-title">카테고리 관리</h2>
      <button id="cat-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <ul id="cat-list" class="cat-list"></ul>
    <button id="cat-add" class="cat-add" type="button">+ 새 카테고리</button>
  </dialog>

  <!-- 할 일 메뉴 (⋯ 버튼을 누르면 열려요) -->
  <dialog id="todo-sheet" class="sheet action-sheet" aria-labelledby="todo-sheet-title">
    <div class="sheet-head">
      <h2 id="todo-sheet-title" class="todo-sheet-title"></h2>
      <button id="todo-sheet-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <div id="todo-sheet-body"></div>
  </dialog>

  <!-- 루틴 관리 (목록 / 만들기·고치기) -->
  <dialog id="routine-dialog" class="sheet routine-sheet" aria-labelledby="routine-title">
    <div class="sheet-head">
      <h2 id="routine-title"></h2>
      <button id="routine-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <div id="routine-body"></div>
  </dialog>

  <!-- 플래너 일정 만들기·고치기 -->
  <dialog id="block-dialog" class="sheet routine-sheet" aria-labelledby="block-title">
    <div class="sheet-head">
      <h2 id="block-title"></h2>
      <button id="block-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <div id="block-body"></div>
  </dialog>

  <!-- 플래너 틀 -->
  <dialog id="template-dialog" class="sheet" aria-labelledby="template-title">
    <div class="sheet-head">
      <h2 id="template-title">플래너 틀</h2>
      <button id="template-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <div id="template-body"></div>
  </dialog>

  <!-- 보관함 -->
  <dialog id="archive-dialog" class="sheet" aria-labelledby="archive-title">
    <div class="sheet-head">
      <h2 id="archive-title">보관함</h2>
      <button id="archive-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <p class="sheet-hint">날짜 없이 넣어 둔 할 일이에요. 누르면 원하는 날짜로 꺼낼 수 있어요.</p>
    <ul id="archive-list" class="archive-list"></ul>
    <p id="archive-empty" class="archive-empty">보관한 할 일이 없어요.</p>
  </dialog>

  <div id="toast" class="toast" role="status">
    <span id="toast-text"></span>
    <button id="toast-action" class="toast-action" type="button" hidden></button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
