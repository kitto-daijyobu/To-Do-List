<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나의 할 일</title>
  <meta name="theme-color" content="#f4f7fb">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calendar" aria-label="달력">
      <div class="cal-header">
        <button id="cal-prev" class="cal-nav" type="button" aria-label="이전 달">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
        </button>
        <h2 id="cal-title" class="cal-title"></h2>
        <button id="cal-next" class="cal-nav" type="button" aria-label="다음 달">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
        </button>
        <button id="cal-today" class="cal-today" type="button">오늘</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
    </section>

    <section class="day">
      <header class="day-header">
        <div class="day-top">
          <p id="day-label" class="day-label"></p>
          <button id="open-cats" class="text-button" type="button">카테고리 관리</button>
        </div>
        <h1 id="day-title" class="day-title"></h1>
        <div class="progress">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
      </header>

      <div id="sections" class="sections"></div>
      <p id="empty-message" class="empty-message">카테고리 이름을 눌러 할 일을 추가해 보세요.</p>
    </section>
  </main>

  <dialog id="cat-dialog" class="sheet" aria-labelledby="cat-dialog-title">
    <div class="sheet-head">
      <h2 id="cat-dialog-title">카테고리 관리</h2>
      <button id="cat-close" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <ul id="cat-list" class="cat-list"></ul>
    <button id="cat-add" class="cat-add" type="button">+ 새 카테고리</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
