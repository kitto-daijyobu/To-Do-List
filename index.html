<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나의 할 일</title>
  <meta name="theme-color" content="#f4f7fb">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="day-header">
      <p class="day-label">오늘</p>
      <h1 id="day-title" class="day-title"></h1>
      <div class="progress">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text"></span>
      </div>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="add-input" class="add-input" type="text" placeholder="할 일을 입력하세요" maxlength="200" aria-label="새 할 일">
      <button class="add-button" type="submit" aria-label="추가">추가</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty-message">아직 할 일이 없어요.<br>위 칸에 입력하고 <b>추가</b>를 눌러 보세요.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
